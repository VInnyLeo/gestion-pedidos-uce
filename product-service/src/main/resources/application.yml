server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: product-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/product_db}
    username: ${DB_USER:product_user}
    password: ${DB_PASSWORD:product_pass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always