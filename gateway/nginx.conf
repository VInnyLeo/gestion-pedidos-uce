# Servidor DNS interno de Docker: sabe qué copias de order-service existen
resolver 127.0.0.11 valid=5s ipv6=off;

# Grupo de copias de order-service. "resolve" vuelve a consultar el DNS
# cada 5 s, así detecta si se agregan o quitan copias.
upstream order_service {
    zone order_service 64k;
    server order-service:8080 resolve;
}

server {
    listen 80;

    location / {
        proxy_pass http://order_service;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        # Muestra qué copia atendió la petición (evidencia del punto 9)
        add_header X-Served-By $upstream_addr always;
    }
}