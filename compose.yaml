services:
  customer-db:
    image: postgres:18-alpine
    container_name: customer-db
    environment:
      POSTGRES_DB: customer_db
      POSTGRES_USER: ${CUSTOMER_DB_USER}
      POSTGRES_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - customer-data:/var/lib/postgresql
    networks:
      - pedidos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  customer-service:
    build: ./customer-service
    image: customer-service:1.0
    container_name: customer-service
    environment:
      DB_URL: jdbc:postgresql://customer-db:5432/customer_db
      DB_USER: ${CUSTOMER_DB_USER}
      DB_PASSWORD: ${CUSTOMER_DB_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      customer-db:
        condition: service_healthy
    networks:
      - pedidos-net

  product-db:
    image: postgres:18-alpine
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: ${PRODUCT_DB_USER}
      POSTGRES_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - product-data:/var/lib/postgresql
    networks:
      - pedidos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    build: ./product-service
    image: product-service:1.0
    container_name: product-service
    environment:
      DB_URL: jdbc:postgresql://product-db:5432/product_db
      DB_USER: ${PRODUCT_DB_USER}
      DB_PASSWORD: ${PRODUCT_DB_PASSWORD}
    ports:
      - "8082:8080"
    depends_on:
      product-db:
        condition: service_healthy
    networks:
      - pedidos-net

  order-db:
    image: postgres:18-alpine
    container_name: order-db
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: ${ORDER_DB_USER}
      POSTGRES_PASSWORD: ${ORDER_DB_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - order-data:/var/lib/postgresql
    networks:
      - pedidos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: ./order-service
    image: order-service:1.0
    environment:
      DB_URL: jdbc:postgresql://order-db:5432/order_db
      DB_USER: ${ORDER_DB_USER}
      DB_PASSWORD: ${ORDER_DB_PASSWORD}
      CUSTOMER_SERVICE_URL: http://customer-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080
    ports:
      - "8083:8080"
    depends_on:
      order-db:
        condition: service_healthy
      customer-service:
        condition: service_started
      product-service:
        condition: service_started
    networks:
      - pedidos-net

  notification-service:
    build: ./notification-service
    image: notification-service:1.0
    container_name: notification-service
    ports:
      - "8085:8080"
    networks:
      - pedidos-net

volumes:
  customer-data:
  product-data:
  order-data:

networks:
  pedidos-net:
    name: pedidos-net